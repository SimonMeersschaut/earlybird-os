<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning briefing | Earlybird</title>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/morning-briefing.css">
</head>
<body>
  <a class="app-clock" href="/" aria-label="Return to the main clock">
    <time id="app-current-time" datetime="00:00">00:00</time>
  </a>
  <main class="app-page briefing-page">
    <span class="app-page-icon" aria-hidden="true">☀</span>
    <h1>Morning briefing</h1>
  </main>
  <script>
    const clock = document.querySelector("#app-current-time");
    const updateClock = () => {
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      clock.textContent = time;
      clock.dateTime = time;
    };
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
